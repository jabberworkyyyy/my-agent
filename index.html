<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Timeline Dashboard</title>
<style>
:root{--bg:#f6f3ee;--panel:#fffdf8;--ink:#221f1a;--muted:#716b61;--line:#e3dccc;--work:#3662ff;--study:#178f70;--life:#bd6b16;--rest:#6b5bd6;--shadow:0 18px 50px rgba(45,37,24,.10)}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;background:radial-gradient(circle at 20% 0%,rgba(255,255,255,.9),transparent 28rem),var(--bg);color:var(--ink)}header{max-width:1180px;margin:0 auto;padding:32px 22px 18px;display:grid;grid-template-columns:1fr auto;gap:18px;align-items:end}h1{margin:0;font-size:clamp(30px,5vw,52px);line-height:1;letter-spacing:0}.sub{margin:12px 0 0;color:var(--muted);font-size:15px}.toolbar{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}button,select{border:1px solid var(--line);background:rgba(255,255,255,.68);color:var(--ink);border-radius:7px;min-height:36px;padding:0 11px;font:inherit;cursor:pointer}button.active{background:var(--ink);color:#fff;border-color:var(--ink)}main{max-width:1180px;margin:0 auto;padding:0 22px 46px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:12px 0 16px}.stat,.panel,.event{background:rgba(255,253,248,.88);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow)}.stat{padding:14px 15px}.stat strong{display:block;font-size:24px;line-height:1.1}.stat span{display:block;margin-top:5px;color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(320px,.8fr);gap:16px;align-items:start}.panel{padding:16px;overflow:hidden}.panel h2{margin:0 0 12px;font-size:17px}.timeline{display:grid;gap:9px}.event{display:grid;grid-template-columns:92px 1fr;gap:12px;padding:12px;box-shadow:none}.time{color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px;padding-top:2px}.title{font-weight:700}.note{color:var(--muted);font-size:13px;margin-top:3px;white-space:pre-line}.pill{display:inline-flex;align-items:center;height:22px;border-radius:999px;padding:0 8px;font-size:12px;color:#fff;margin-top:8px}.bars{display:grid;gap:10px}.barrow{display:grid;grid-template-columns:76px 1fr 54px;gap:10px;align-items:center;font-size:13px}.bartrack{height:9px;border-radius:999px;background:#eee7da;overflow:hidden}.bar{height:100%;border-radius:inherit;min-width:2px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.day{border:1px solid var(--line);background:rgba(255,255,255,.5);border-radius:7px;min-height:54px;padding:7px;cursor:pointer;text-align:left}.day.active{border-color:var(--ink);background:#fff}.day small{display:block;color:var(--muted);font-size:11px}.day strong{font-size:15px}.empty{color:var(--muted);padding:18px 0}footer{max-width:1180px;margin:0 auto;padding:0 22px 32px;color:var(--muted);font-size:12px}@media(max-width:850px){header{grid-template-columns:1fr}.toolbar{justify-content:flex-start}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.grid{grid-template-columns:1fr}.event{grid-template-columns:74px 1fr}.calendar{grid-template-columns:repeat(4,1fr)}}</style>
</head>
<body>
<header><div><h1>Timeline Dashboard</h1><p class="sub" id="subtitle"></p></div><div class="toolbar"><button data-filter="all" class="active">全部</button><button data-filter="cpa">CPA</button><button data-filter="today">今天</button><select id="daySelect"></select></div></header>
<main><section class="stats" id="stats"></section><section class="grid"><div class="panel"><h2 id="timelineTitle">事件时间线</h2><div class="timeline" id="timeline"></div></div><div class="panel"><h2>分类分布</h2><div class="bars" id="bars"></div><h2 style="margin-top:22px">日期</h2><div class="calendar" id="calendar"></div></div></section></main><footer id="footer"></footer>
<script>
const cpa=[{"date":"2026-05-16","items":[[1,"金融资产的分类及会计处理"],[2,"金融负债与权益工具的区分"],[3,"重大影响的判断与合并范围的确定"],[4,"权益法核算的长期股权投资"],[5,"非同一控制下企业合并在个别财务报表和合并财务报表中的会计处理"]]},{"date":"2026-05-17","items":[[6,"同一控制下企业合并在个别财务报表和合并财务报表中的会计处理"],[7,"不丧失控制权处置部分子公司股权在个别财务报表和合并财务报表中的会计处理"],[8,"丧失控制权处置部分子公司股权在个别财务报表和合并财务报表中的会计处理"],[9,"识别合同及合同中的单项履约义务"],[10,"确定和分摊交易价格"]]},{"date":"2026-05-18","items":[[11,"在某一时点或某一时段确认收入"],[12,"合同成本"],[13,"特定交易的会计处理"]]},{"date":"2026-05-19","items":[[14,"租赁的识别"],[15,"承租人的会计处理"],[16,"出租人的会计处理"]]},{"date":"2026-05-20","items":[[17,"特殊租赁业务的会计处理"],[18,"存货的会计处理"],[19,"各类长期资产的会计处理"]]},{"date":"2026-05-21","items":[[20,"借款费用的会计处理"],[21,"长期资产减值的会计处理"],[22,"持有待售和终止经营的会计处理"]]},{"date":"2026-05-22","items":[[23,"职工薪酬的会计处理"],[24,"股份支付的会计处理"],[25,"或有事项的会计处理"]]},{"date":"2026-05-23","items":[[26,"政府补助的会计处理"],[27,"权益性交易的会计处理"],[28,"非货币性资产交换的会计处理"],[29,"债务重组的会计处理"],[30,"外币折算的会计处理"]]},{"date":"2026-05-24","items":[[31,"财务报表列报和关联方的认定"],[32,"会计政策、会计估计变更和差错更正"],[33,"资产负债表日后事项"],[34,"接受业务委托和关键审计安排"],[35,"重要组成部分的识别和应执行的程序"]]},{"date":"2026-05-25","items":[[36,"重要性以及集团审计的特殊考虑"],[37,"利用专家或内部审计的工作"],[38,"重大错报风险识别和评估"]]},{"date":"2026-05-26","items":[[39,"存货的审计"],[40,"长期资产的审计"],[41,"货币资金的审计"]]},{"date":"2026-05-27","items":[[42,"应收账款及其他金融工具的审计"],[43,"应付账款的审计"],[44,"收入和费用的审计"]]},{"date":"2026-05-28","items":[[45,"增值税——征税范围"],[46,"增值税——销项税额"],[47,"增值税——进项税额"]]},{"date":"2026-05-29","items":[[48,"企业所得税——收入类"],[49,"企业所得税——扣除类"],[50,"企业所得税——其他特殊调整"]]},{"date":"2026-05-30","items":[[51,"PEST分析"],[52,"产品生命周期分析"],[53,"产业五种竞争力模型"],[54,"战略群组分析的作用"],[55,"资源与能力分析"]]},{"date":"2026-05-31","items":[[56,"价值链分析与波士顿矩阵分析"],[57,"SWOT分析"],[58,"发展战略、实现途径与组织结构"],[59,"收缩战略"],[60,"竞争战略"]]},{"date":"2026-06-01","items":[[61,"蓝海战略与商业模式"],[62,"职能战略"],[63,"国际化经营与涉外经济法律制度"]]},{"date":"2026-06-02","items":[[64,"组织结构类型"],[65,"创新管理"],[66,"数字化转型"]]},{"date":"2026-06-03","items":[[67,"资金预测与增长率预测"],[68,"股权筹资"],[69,"债务筹资"]]},{"date":"2026-06-04","items":[[70,"优先股筹资"],[71,"可转债筹资"],[72,"证券违法行为与投资者保护"]]},{"date":"2026-06-05","items":[[73,"资本结构"],[74,"上市公司收购"],[75,"重大资产重组"]]},{"date":"2026-06-06","items":[[76,"发行股份购买资产"],[77,"企业价值评估"],[78,"投资项目决策"],[79,"实物期权价值评估"],[80,"证券价值评估"]]},{"date":"2026-06-07","items":[[81,"投资平台——有限合伙企业"],[82,"管理实践发展与公司治理"],[83,"股东会"],[84,"董事会（含独立董事制度）"],[85,"监事会"]]},{"date":"2026-06-08","items":[[86,"经理层"],[87,"股东的权利与义务"]]},{"date":"2026-06-09","items":[[88,"董监高的资格和法定义务"],[89,"预算管理"]]},{"date":"2026-06-10","items":[[90,"营运资金与票据管理"],[91,"经营决策"]]},{"date":"2026-06-11","items":[[92,"经营分析与财务分析"],[93,"企业业绩评价"]]},{"date":"2026-06-12","items":[[94,"责任中心业绩评价与内部转移价格"],[95,"成本管理"]]},{"date":"2026-06-13","items":[[96,"风险管理"],[97,"内部控制"],[98,"股利理论与股利政策"],[99,"股利类型与股份回购"],[100,"公积金提取和利润分配"]]}];
const routine=[['08:30','09:00','起床与出门准备','life','生活',''],['09:00','10:00','地铁通勤：看书或背诵','study','学习',''],['10:00','12:20','到达公司并工作','work','工作','位置：陆家嘴'],['12:20','13:00','午饭','life','生活',''],['13:00','14:00','午休','rest','休息',''],['14:00','18:10','下午工作','work','工作','位置：陆家嘴'],['18:10','19:10','地铁通勤：看书或背诵','study','学习',''],['19:10','20:30','到家与晚饭','life','生活',''],['20:30','23:30','晚上活动','life','生活',''],['23:30','23:59','上床准备睡觉','rest','休息','']];
const labels={life:'生活',study:'学习',work:'工作',rest:'休息'},colors={work:'var(--work)',study:'var(--study)',life:'var(--life)',rest:'var(--rest)'};let filter='all',visibleDays=[],selectedDay='';function today(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Shanghai'}).format(new Date())}function isWeekday(d){const w=new Date(d+'T00:00:00+08:00').getDay();return w!==0&&w!==6}function rangeDates(){const out=[];for(let d=new Date('2026-05-16T00:00:00+08:00'),e=new Date('2026-06-30T00:00:00+08:00');d<=e;d.setDate(d.getDate()+1)){out.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'))}return out}function cpaEvents(day){const p=cpa.find(x=>x.date===day);if(!p)return[];const half=Math.ceil(p.items.length/2),parts=isWeekday(day)?[[p.items,'20:30','22:30']]:[[p.items.slice(0,half),'10:00','12:00'],[p.items.slice(half),'14:00','17:00']];return parts.filter(x=>x[0].length).map(([items,start,end])=>({start,end,title:'CPA综合第一轮：第 '+items[0][0]+'-'+items[items.length-1][0]+' 记',note:items.map(i=>'第 '+i[0]+' 记：'+i[1]).join('\n'),categoryId:'study',label:'学习',source:'cpa'}))}function events(day){const base=isWeekday(day)?routine.map(r=>({start:r[0],end:r[1],title:r[2],categoryId:r[3],label:r[4],note:r[5],source:'routine'})):[];return base.concat(cpaEvents(day)).sort((a,b)=>a.start.localeCompare(b.start))}function mins(e){const a=e.start.split(':').map(Number),b=e.end.split(':').map(Number);return b[0]*60+b[1]-a[0]*60-a[1]}function compute(){visibleDays=rangeDates().map(date=>({date,events:events(date).filter(e=>filter==='all'||filter==='today'||e.source===filter)})).filter(d=>d.events.length);if(filter==='today')visibleDays=visibleDays.filter(d=>d.date===today());if(!selectedDay||!visibleDays.some(d=>d.date===selectedDay))selectedDay=visibleDays[0]?.date||''}function render(){compute();document.getElementById('subtitle').textContent='2026-05-16 至 2026-06-30 · Asia/Shanghai';document.getElementById('footer').textContent='Static GitHub Pages dashboard · CPA第一轮到 2026-06-13';renderStats();renderSelect();renderCalendar();renderTimeline();renderBars()}function renderStats(){const ev=visibleDays.flatMap(d=>d.events),items=cpa.reduce((s,d)=>s+d.items.length,0);document.getElementById('stats').innerHTML=[['天数',visibleDays.length],['事件',ev.length],['CPA知识点',items],['完成期限','6/13']].map(r=>'<div class="stat"><strong>'+r[1]+'</strong><span>'+r[0]+'</span></div>').join('')}function renderSelect(){const s=document.getElementById('daySelect');s.innerHTML=visibleDays.map(d=>'<option value="'+d.date+'" '+(d.date===selectedDay?'selected':'')+'>'+d.date+'</option>').join('');s.onchange=()=>{selectedDay=s.value;renderTimeline();renderCalendar()}}function renderCalendar(){document.getElementById('calendar').innerHTML=visibleDays.map(d=>'<button class="day '+(d.date===selectedDay?'active':'')+'" data-day="'+d.date+'"><small>'+d.date.slice(0,7)+'</small><strong>'+d.date.slice(8)+'</strong><small>'+d.events.length+' events</small></button>').join('')||'<div class="empty">没有匹配事件</div>';document.querySelectorAll('.day').forEach(b=>b.onclick=()=>{selectedDay=b.dataset.day;renderSelect();renderTimeline();renderCalendar()})}function esc(v){return String(v).replace(/[&<>"]/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[s]))}function renderTimeline(){const day=visibleDays.find(d=>d.date===selectedDay)||visibleDays[0];document.getElementById('timelineTitle').textContent=(day?.date||'')+' 事件时间线';document.getElementById('timeline').innerHTML=day?.events.map(e=>'<article class="event"><div class="time">'+e.start+'<br>'+e.end+'</div><div><div class="title">'+esc(e.title)+'</div>'+(e.note?'<div class="note">'+esc(e.note)+'</div>':'')+'<span class="pill" style="background:'+(colors[e.categoryId]||'var(--life)')+'">'+(labels[e.categoryId]||e.categoryId)+'</span></div></article>').join('')||'<div class="empty">没有事件</div>'}function renderBars(){const totals=new Map();visibleDays.flatMap(d=>d.events).forEach(e=>totals.set(e.categoryId,(totals.get(e.categoryId)||0)+mins(e)));const rows=Array.from(totals.entries()).sort((a,b)=>b[1]-a[1]),max=Math.max(...rows.map(r=>r[1]),1);document.getElementById('bars').innerHTML=rows.map(r=>'<div class="barrow"><span>'+(labels[r[0]]||r[0])+'</span><div class="bartrack"><div class="bar" style="width:'+Math.max(3,r[1]/max*100)+'%;background:'+(colors[r[0]]||'var(--life)')+'"></div></div><span>'+Math.round(r[1]/60)+'h</span></div>').join('')||'<div class="empty">没有数据</div>'}document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-filter]').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter;selectedDay='';render()});render();
</script>
</body>
</html>
